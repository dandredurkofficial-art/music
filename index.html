<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audiory - Free Music Streaming</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#FFA500', hover: '#E09200', bg: '#0D0D0F', card: '#18181C', border: '#26262B' }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-brand-bg text-gray-100 font-sans min-h-screen flex flex-col pb-36">

  <!-- INLINE NOTIFICATION BANNER -->
  <div id="inline-toast" class="fixed top-4 right-4 z-50 hidden max-w-sm px-4 py-3 rounded-xl bg-brand-card border border-brand text-sm font-semibold text-white shadow-2xl flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4 text-brand"></i>
    <span id="toast-message"></span>
  </div>

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-brand-bg/95 backdrop-blur-md border-b border-brand-border px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 bg-brand rounded-lg flex items-center justify-center font-black text-black text-sm">A</div>
      <span class="font-extrabold text-xl tracking-tight text-white">audiory<span class="text-brand">+</span></span>
    </div>

    <div class="flex items-center gap-4">
      <a href="/creators/index.html" class="text-gray-300 hover:text-white"><i data-lucide="upload-cloud" class="w-5 h-5"></i></a>
      <button onclick="checkAuthAndRedirect()" class="relative text-gray-300 hover:text-white">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-brand rounded-full"></span>
      </button>
      <a href="/login/index.html" id="nav-auth-link" class="text-gray-300 hover:text-white"><i data-lucide="user" class="w-5 h-5"></i></a>
    </div>
  </header>

  <!-- GENRE PILL SCROLLER -->
  <div class="px-4 py-3 flex items-center gap-2 overflow-x-auto no-scrollbar border-b border-brand-border/40">
    <button class="bg-brand text-black font-bold text-xs px-4 py-2 rounded-full whitespace-nowrap">All</button>
    <button class="bg-[#1A1A20] text-gray-300 font-semibold text-xs px-4 py-2 rounded-full border border-brand-border whitespace-nowrap">Hip-Hop</button>
    <button class="bg-[#1A1A20] text-gray-300 font-semibold text-xs px-4 py-2 rounded-full border border-brand-border whitespace-nowrap">Pop</button>
    <button class="bg-[#1A1A20] text-gray-300 font-semibold text-xs px-4 py-2 rounded-full border border-brand-border whitespace-nowrap">Afrosounds</button>
    <button class="bg-[#1A1A20] text-gray-300 font-semibold text-xs px-4 py-2 rounded-full border border-brand-border whitespace-nowrap">Caribbean</button>
  </div>

  <!-- MAIN TAB CONTENT -->
  <main class="px-4 py-4 max-w-7xl mx-auto w-full space-y-8">

    <!-- DISCOVER VIEW -->
    <div id="view-discover" class="view-section space-y-6">
      
      <!-- IN ROTATION / RECENTLY PLAYED -->
      <section>
        <h2 class="text-lg font-black tracking-tight mb-3 uppercase">In Rotation</h2>
        <div id="container-rotation" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
          <div class="col-span-full py-8 text-center text-xs text-gray-500">Loading tracks from D1...</div>
        </div>
      </section>

      <!-- ACCOUNTS FOR YOU -->
      <section>
        <h2 class="text-lg font-black tracking-tight mb-3 uppercase">Accounts For You</h2>
        <div id="container-artists" class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
          <div class="py-4 text-center text-xs text-gray-500">Loading creators...</div>
        </div>
      </section>

      <!-- RECENTLY ADDED -->
      <section>
        <h2 class="text-lg font-black tracking-tight mb-3 uppercase">Recently Added</h2>
        <div id="container-recent-list" class="divide-y divide-brand-border/40 bg-brand-card rounded-2xl border border-brand-border overflow-hidden">
          <div class="p-4 text-center text-xs text-gray-500">Connecting to database...</div>
        </div>
      </section>
    </div>

    <!-- CHARTS VIEW -->
    <div id="view-charts" class="view-section hidden space-y-4">
      <h2 class="text-xl font-black">Top Songs & Charts</h2>
      <div id="container-charts-list" class="bg-brand-card rounded-2xl border border-brand-border divide-y divide-brand-border/40"></div>
    </div>

    <!-- SEARCH VIEW -->
    <div id="view-search" class="view-section hidden space-y-4">
      <div class="relative">
        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="search-input" placeholder="Search artists, songs, albums..." class="w-full bg-brand-card border border-brand-border rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-brand" onkeyup="executeSearch(this.value)" />
      </div>
      <div id="container-search-results" class="space-y-2"></div>
    </div>

    <!-- MY LIBRARY VIEW -->
    <div id="view-library" class="view-section hidden space-y-4">
      <h2 class="text-xl font-black">My Library</h2>
      <div class="space-y-2">
        <div class="p-4 bg-brand-card border border-brand-border rounded-xl flex items-center justify-between cursor-pointer" onclick="showToast('Fetching your liked tracks...')">
          <div class="flex items-center gap-3">
            <i data-lucide="heart" class="w-5 h-5 text-brand"></i>
            <span class="font-bold text-sm">Likes</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
        </div>
      </div>
    </div>

  </main>

  <!-- PERSISTENT BOTTOM AUDIOMACK-STYLE PLAYER -->
  <div class="fixed bottom-16 left-0 right-0 z-40 bg-[#121216]/95 backdrop-blur-md border-t border-brand-border px-4 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-3 truncate max-w-[60%]">
      <img id="player-img" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" class="w-10 h-10 rounded-lg object-cover border border-brand-border" />
      <div class="truncate">
        <div id="player-title" class="font-bold text-xs text-white truncate">Select a Track</div>
        <div id="player-artist" class="text-[10px] text-gray-400 truncate">Audiory Platform</div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button id="player-play-btn" onclick="togglePlayback()" class="w-9 h-9 bg-brand text-black rounded-full flex items-center justify-center">
        <i data-lucide="play" class="w-4 h-4 fill-current"></i>
      </button>
      <button onclick="showToast('Added to Queue')" class="text-gray-400"><i data-lucide="more-vertical" class="w-5 h-5"></i></button>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION TAB BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0A0A0C] border-t border-brand-border h-16 flex items-center justify-around text-gray-400 text-[10px] font-bold">
    <button onclick="switchTab('discover')" class="tab-btn active text-brand flex flex-col items-center gap-1" id="btn-tab-discover">
      <i data-lucide="flame" class="w-5 h-5"></i>
      <span>Discover</span>
    </button>
    <button onclick="switchTab('charts')" class="tab-btn flex flex-col items-center gap-1" id="btn-tab-charts">
      <i data-lucide="trending-up" class="w-5 h-5"></i>
      <span>Charts</span>
    </button>
    <button onclick="switchTab('search')" class="tab-btn flex flex-col items-center gap-1" id="btn-tab-search">
      <i data-lucide="search" class="w-5 h-5"></i>
      <span>Search</span>
    </button>
    <button onclick="switchTab('library')" class="tab-btn flex flex-col items-center gap-1" id="btn-tab-library">
      <i data-lucide="library" class="w-5 h-5"></i>
      <span>My Library</span>
    </button>
  </nav>

  <audio id="audio-engine" class="hidden"></audio>

  <script>
    const API_BASE = 'https://audiorydistribution.dandredurkofficial.workers.dev';
    const audioElement = document.getElementById('audio-engine');
    let isPlaying = false;

    lucide.createIcons();

    function showToast(msg) {
      const toast = document.getElementById('inline-toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function switchTab(tab) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('text-brand'));
      
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-tab-${tab}`).classList.add('text-brand');
    }

    async function loadTracksFromD1() {
      try {
        const res = await fetch(`${API_BASE}/api/v1/tracks`);
        if (!res.ok) throw new Error('API request failed');
        const tracks = await res.json();
        
        if (tracks && tracks.length > 0) {
          renderTracks(tracks);
        } else {
          showEmptyState();
        }
      } catch (err) {
        showEmptyState();
      }
    }

    function showEmptyState() {
      document.getElementById('container-rotation').innerHTML = `
        <div class="col-span-full py-6 text-center bg-brand-card rounded-2xl border border-brand-border">
          <p class="text-xs text-gray-400">No tracks uploaded yet in D1.</p>
          <a href="/creators/index.html" class="inline-block mt-2 text-xs font-bold text-brand hover:underline">Upload First Track →</a>
        </div>
      `;
      document.getElementById('container-recent-list').innerHTML = `
        <div class="p-6 text-center text-xs text-gray-500">No tracks available in database.</div>
      `;
    }

    function renderTracks(tracks) {
      const rotationContainer = document.getElementById('container-rotation');
      rotationContainer.innerHTML = tracks.map(t => `
        <div class="bg-brand-card p-2.5 rounded-xl border border-brand-border cursor-pointer hover:border-brand/50 transition-all" onclick="playAudioStream('${t.id}', '${t.title}', '${t.artist_id}')">
          <div class="aspect-square bg-[#222] rounded-lg mb-2 overflow-hidden flex items-center justify-center">
            <i data-lucide="music" class="w-8 h-8 text-gray-600"></i>
          </div>
          <div class="font-bold text-xs truncate text-white">${t.title}</div>
          <div class="text-[10px] text-gray-400 truncate">Creator ID: ${t.artist_id.substring(0,6)}...</div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function playAudioStream(trackId, title, artist) {
      document.getElementById('player-title').innerText = title;
      document.getElementById('player-artist').innerText = artist;
      audioElement.src = `${API_BASE}/api/v1/tracks/${trackId}/stream`;
      audioElement.play();
      isPlaying = true;
      updatePlayBtn();

      // Log play count event
      fetch(`${API_BASE}/api/v1/analytics/history`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ track_id: trackId })
      });
    }

    function togglePlayback() {
      if (!audioElement.src) return;
      if (audioElement.paused) {
        audioElement.play();
        isPlaying = true;
      } else {
        audioElement.pause();
        isPlaying = false;
      }
      updatePlayBtn();
    }

    function updatePlayBtn() {
      const btn = document.getElementById('player-play-btn');
      btn.innerHTML = isPlaying ? `<i data-lucide="pause" class="w-4 h-4 fill-current"></i>` : `<i data-lucide="play" class="w-4 h-4 fill-current"></i>`;
      lucide.createIcons();
    }

    function checkAuthAndRedirect() {
      const token = localStorage.getItem('audiory_token');
      if (token) {
        window.location.href = '/creators/index.html';
      } else {
        window.location.href = '/login/index.html';
      }
    }

    // Load Live D1 Data
    loadTracksFromD1();
  </script>
</body>
</html>
