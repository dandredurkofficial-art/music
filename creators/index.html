<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creator Studio - Audiory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#FFA500', bg: '#0D0D0F', card: '#18181C', border: '#26262B' } }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-bg text-gray-100 font-sans min-h-screen">

  <!-- INLINE STATUS TOAST -->
  <div id="creator-toast" class="fixed top-4 right-4 z-50 hidden max-w-sm p-4 bg-brand-card border border-brand rounded-xl text-xs text-white font-semibold shadow-2xl"></div>

  <header class="bg-brand-card border-b border-brand-border px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/" class="text-xl font-black text-white">audiory<span class="text-brand"> Studio</span></a>
    </div>
    <button onclick="logout()" class="text-xs font-bold text-gray-400 hover:text-white">Sign Out</button>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    
    <!-- CREATOR PROFILE OVERVIEW -->
    <section class="bg-brand-card border border-brand-border p-6 rounded-2xl flex flex-col sm:flex-row items-center gap-6">
      <div class="w-20 h-20 bg-brand/10 border-2 border-brand rounded-full flex items-center justify-center text-brand font-black text-2xl" id="avatar-placeholder">C</div>
      <div class="text-center sm:text-left flex-1 space-y-1">
        <h1 class="text-2xl font-black text-white" id="creator-name">Creator Dashboard</h1>
        <p class="text-xs text-gray-400" id="creator-email">Loading authenticated profile...</p>
      </div>
    </section>

    <!-- UPLOAD TRACK TO D1 & R2 -->
    <section class="bg-brand-card border border-brand-border p-6 rounded-2xl space-y-4">
      <h2 class="text-lg font-black text-white flex items-center gap-2">
        <i data-lucide="upload-cloud" class="w-5 h-5 text-brand"></i> Upload New Track
      </h2>

      <form onsubmit="handleUploadTrack(event)" class="space-y-4">
        <div>
          <label class="text-xs font-bold text-gray-400 uppercase">Track Title</label>
          <input type="text" id="track-title" required class="w-full bg-[#121216] border border-brand-border rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none focus:border-brand" />
        </div>

        <div>
          <label class="text-xs font-bold text-gray-400 uppercase">R2 Storage Audio Object Key</label>
          <input type="text" id="track-key" placeholder="tracks/song-file.mp3" required class="w-full bg-[#121216] border border-brand-border rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none focus:border-brand" />
        </div>

        <button type="submit" id="upload-btn" class="bg-brand hover:bg-brand/90 text-black font-extrabold px-6 py-3 rounded-xl text-sm transition-all">
          Publish Track
        </button>
      </form>
    </section>

    <!-- PAYOUT REQUEST -->
    <section class="bg-brand-card border border-brand-border p-6 rounded-2xl space-y-4">
      <h2 class="text-lg font-black text-white flex items-center gap-2">
        <i data-lucide="dollar-sign" class="w-5 h-5 text-brand"></i> Request Payout
      </h2>

      <form onsubmit="handlePayout(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <input type="number" id="payout-amount" placeholder="Amount USD" min="10" required class="bg-[#121216] border border-brand-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand" />
        <select id="payout-method" class="bg-[#121216] border border-brand-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand">
          <option value="bank_transfer">Direct Bank</option>
          <option value="paypal">PayPal</option>
        </select>
        <button type="submit" class="bg-white text-black font-extrabold px-6 py-3 rounded-xl text-sm hover:bg-gray-200">
          Submit Payout
        </button>
      </form>
    </section>

  </main>

  <script>
    const API_BASE = 'https://audiorydistribution.dandredurkofficial.workers.dev';
    const token = localStorage.getItem('audiory_token');

    lucide.createIcons();

    if (!token) {
      window.location.href = '/login/index.html';
    }

    function showToast(msg) {
      const toast = document.getElementById('creator-toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    async function loadCreatorProfile() {
      try {
        const res = await fetch(`${API_BASE}/api/v1/users/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Session expired');
        const user = await res.json();
        
        document.getElementById('creator-name').innerText = user.display_name;
        document.getElementById('creator-email').innerText = user.email;
        document.getElementById('avatar-placeholder').innerText = user.display_name.charAt(0).toUpperCase();
      } catch (err) {
        logout();
      }
    }

    async function handleUploadTrack(e) {
      e.preventDefault();
      const title = document.getElementById('track-title').value;
      const audio_key = document.getElementById('track-key').value;
      const btn = document.getElementById('upload-btn');

      btn.innerText = 'Publishing...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/v1/tracks`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, audio_key, duration: 180 })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Upload failed');

        showToast(`Track "${title}" published successfully!`);
        document.getElementById('track-title').value = '';
        document.getElementById('track-key').value = '';
      } catch (err) {
        showToast(`Error: ${err.message}`);
      } finally {
        btn.innerText = 'Publish Track';
        btn.disabled = false;
      }
    }

    async function handlePayout(e) {
      e.preventDefault();
      const amount_usd = document.getElementById('payout-amount').value;
      const payout_method = document.getElementById('payout-method').value;

      try {
        const res = await fetch(`${API_BASE}/api/v1/payouts`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ amount_usd: parseFloat(amount_usd), payout_method })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Payout request failed');

        showToast(`Payout request for $${amount_usd} submitted!`);
      } catch (err) {
        showToast(`Error: ${err.message}`);
      }
    }

    function logout() {
      localStorage.removeItem('audiory_token');
      localStorage.removeItem('audiory_user');
      window.location.href = '/login/index.html';
    }

    loadCreatorProfile();
  </script>
</body>
</html>
